[project]
name = "pixeltable-mural-registry"
version = "0.1.0"
description = "Public-art mural registry API: wall photo uploads with thumbnails, grayscale copies and color tags - built with Pixeltable"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Pierre Brunelle" }]
keywords = ["pixeltable", "multimodal", "ai", "fastapi", "computed-columns", "data-infrastructure", "mural-registry"]
dependencies = [
    "pixeltable[serve]>=0.7.14",
    "pillow",
]

[project.urls]
Homepage = "https://pixeltable.com"
Documentation = "https://docs.pixeltable.com"
Pixeltable = "https://github.com/pixeltable/pixeltable"
